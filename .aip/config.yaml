# AIP 项目配置。只放引擎和 AI 真会用到的几项；项目铁律、做事规矩写进 conventions.md。
#
# 本项目 = AIP 自身：零依赖的 Python CLI + 可分发插件包（Codex/Claude Code）。

# 验证命令：AI 声明「做完了」之前要真跑通的命令（在仓库根执行）。aip check 不跑它们。
# 本项目纯标准库、无构建步、无 lint 配置；唯一会真跑的检查是单元测试。
# 要 Python 3.9+：先用 python3，没有再用 python 并确认版本。
gates:
  tests:
    cmd: "python3 -m unittest discover -s tests -p \"test_*.py\""
  build:
    # cmd: ""              # 纯 Python，无构建步
  lint_or_drift:
    # cmd: ""              # 无 lint；版本一致性（三份 plugin.json 对 skills/aip/VERSION）由 aip check 覆盖
  e2e:
    # cmd: ""              # 无 e2e 场景

# 上次整份 .aip/ review 的日期（做法见 aip 技能 reference/review-checklist.md）。
# 超过 30 天，会话开始和 aip check 会提醒；做完 review 把它改成当天。
review_last_full: "2026-10-01"

# 这个仓库的 .aip/ 按哪一版 AIP 的模板整理过。升级 AIP 后，会话开始会对照 aip 技能
# reference/upgrade.md 提醒还没做的调整；做完改成提醒里给的版本号。
aip_version: "0.7.0"
